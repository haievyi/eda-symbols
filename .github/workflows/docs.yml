name: Build & Deploy Documentation Automatically

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build C++ Project
        run: cmake --build build --config Release --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Generate Symbol PNGs
        run: |
          New-Item -ItemType Directory -Force -Path "docs/assets/images"
          & "build/tests/Release/export_symbol_images.exe" "docs/assets/images"

      - name: Copy Root Markdown Files into Docs
        run: |
          Copy-Item CHANGELOG.md -Destination docs/changelog.md
          Copy-Item SYMBOLS.md -Destination docs/symbols.md

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build Documentation Site
        run: mkdocs build --strict

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
